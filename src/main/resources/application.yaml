quarkus:
  datasource:
    db-kind: postgresql
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
    jdbc:
      url: ${DB_URL}
  flyway:
    baseline-on-migrate: true
    migrate-at-start: true
  devservices:
    enabled: false

"%test":
  quarkus:
    hibernate-orm:
      active: false
    datasource:
      active: false

"%prod":
  quarkus:
    flyway:
      clean-disabled: true
      migrate-at-start: false