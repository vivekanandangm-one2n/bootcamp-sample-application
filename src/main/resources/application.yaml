"%dev":
  quarkus:
    datasource:
      db-kind: postgresql
      username: ${DB_USER_NAME}
      password: ${DB_PASSWORD}
      jdbc:
        url: ${DB_URL}
    flyway:
      baseline-on-migrate: true
      migrate-at-start: true
    devservices:
      enabled: false

"%test":
  quarkus:
    devservices:
      enabled: true
    #    datasource:
    #      devservices:
    #        init-script-path: "db/seed.sql"
    flyway:
      baseline-on-migrate: true
      migrate-at-start: true

"%prod":
  quarkus:
    flyway:
      clean-disabled: true
      migrate-at-start: false